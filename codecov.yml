# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    # Overall project coverage check
    project:
      default:
        # Don't fail the check based on absolute coverage
        # Just report the coverage level
        informational: true
    # Per-PR coverage change check
    patch:
      default:
        # Ratchet quality upward even while the legacy project total is below
        # the long-term target. Changed executable lines must be well tested.
        target: 80%
        threshold: 0%
        informational: false

# Coverage arrives as ONE already-merged report (the `coverage-report` CI job
# runs build_scripts/mergeLcov.js over the unit + integration-shard lcovs and
# uploads the union). We deliberately do NOT use flags: uploading the pieces
# separately let Codecov's cross-flag/cross-upload combination lose real coverage
# (a line covered by one shard but 0 in the others didn't reliably count) and
# inflate the denominator via mismatched file lists. One merged upload == the
# local `coverage:merged` number.

# Comment settings for PR coverage reports
comment:
  layout: "reach,diff,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore these paths in coverage calculations
ignore:
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "tests/**"
  - "ts_emitted/**"
  - "node_modules/**"
  - "coverage/**"
  - "build_scripts/**"
  - "src/generated/**"
  - "ogm_types.ts"
  - "typeDefs.ts"
  - "index.ts"
  - "**/*.d.ts"
