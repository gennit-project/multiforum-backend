# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    # Overall project coverage check
    project:
      default:
        # Don't fail the check based on absolute coverage
        # Just report the coverage level
        informational: true
    # Per-PR coverage change check
    patch:
      default:
        # Ratchet quality upward even while the legacy project total is below
        # the long-term target. Changed executable lines must be well tested.
        target: 80%
        threshold: 0%
        informational: false

# The `coverage-report` CI job builds ONE merged report (c8 report over every
# job's raw coverage == the local `coverage:merged` number) and uploads that SAME
# complete report under both flags below. We do NOT upload partial per-suite
# reports: Codecov's cross-upload combination lost real coverage (a line covered
# by one shard but 0 in the others didn't reliably count) and inflated the
# denominator. Both flags carry the full merged coverage, so the project total
# equals the merged number; carryforward just preserves the last good value if a
# run fails to upload.
flags:
  unit:
    carryforward: true
  integration:
    carryforward: true

# Comment settings for PR coverage reports
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore these paths in coverage calculations
ignore:
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "tests/**"
  - "ts_emitted/**"
  - "node_modules/**"
  - "coverage/**"
  - "build_scripts/**"
  - "src/generated/**"
  - "ogm_types.ts"
  - "typeDefs.ts"
  - "index.ts"
  - "**/*.d.ts"
