name: Tests CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Detect whether anything other than documentation changed. We do NOT use a
  # workflow-level `paths-ignore`, because `unit-tests` is a REQUIRED status
  # check on `main`: a path-filtered workflow never reports the check, which
  # would leave docs-only PRs stuck "pending" and unmergeable. Instead the
  # required job always runs (so it always reports). For docs-only changes it
  # still generates and uploads coverage so the required Codecov check reports,
  # while the remaining code-quality and integration work is skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # If the base commit isn't available (e.g. a brand-new branch reports
          # an all-zero "before"), fail safe and run the full pipeline.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable; running full CI."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"
          echo "$changed"

          # Docs = anything under docs/ or any *.md file. If anything else
          # changed, run the tests.
          if echo "$changed" | grep -vE '(^docs/|\.md$)' | grep -q .; then
            echo "Non-docs changes detected → running tests."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change → skipping tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Required check on `main`. Always runs so it always reports a status.
  # Coverage also runs for docs-only PRs because `codecov/patch` is required by
  # branch protection and Codecov cannot report a status without an upload.
  # Lint, type checking, circular checks, integration tests, and the build are
  # still gated on a non-docs change.
  unit-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Clean install dependencies
        run: pnpm install --frozen-lockfile

      # Generated type files (ogm_types.ts, src/generated/graphql.ts) are no
      # longer committed; regenerate them from typeDefs.ts (no DB needed) before
      # type checking and tests so imports resolve.
      - name: Generate GraphQL/OGM types
        run: pnpm run codegen

      - name: Lint (enforces no console.* in runtime code)
        if: needs.changes.outputs.code == 'true'
        run: pnpm run lint

      - name: Run TypeScript type checking
        if: needs.changes.outputs.code == 'true'
        run: pnpm run tsc

      - name: Check for circular dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm run lint:circular

      - name: Run unit tests with coverage
        run: pnpm run coverage

      # ts-node labels transpiled code with the original .ts URL, so c8 cannot
      # remap this new module's generated line numbers. Exercise its compiled
      # output as a supplemental report with tsc's unambiguous source map.
      - name: Collect source-mapped startup provisioning coverage
        if: needs.changes.outputs.code == 'true'
        run: pnpm run coverage:startup-provisioning

      # Coverage is NOT uploaded to Codecov here. Each test job saves its RAW c8
      # coverage (coverage/tmp/*.json) as an artifact; the `coverage-report` job
      # runs a single `c8 report` over all of them, so every file is counted once
      # — reproducing the local `coverage:merged` number. (Merging the finished
      # lcovs instead let all:true's per-run line-count differences inflate the
      # denominator; merging the raw data avoids that.)
      - name: Save unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: cov-v8-unit
          path: coverage/tmp
          if-no-files-found: error
          retention-days: 1

      # The startup-provisioning supplement is source-mapped via tsc (not ts-node)
      # and produced as a standalone lcov; carry it as-is and union it in at the end.
      - name: Save startup-provisioning coverage report
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cov-lcov-startup
          path: coverage/startup-provisioning/lcov.info
          if-no-files-found: error
          retention-days: 1

      # codegen and tsc already ran above, which covers the first two commands
      # in the build script. Complete the remaining asset-copy step without
      # regenerating and recompiling the entire project a second time.
      - name: Complete build (copy Cypher assets)
        if: needs.changes.outputs.code == 'true'
        run: node build_scripts/copyCypherFiles.js

      - name: Docs-only change — tests skipped
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; unit tests skipped."

  integration-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The integration suite is the CI bottleneck (serial, real Neo4j). Split it
    # into parallel shards — each matrix job runs ~1/N of the files against its
    # own Testcontainers Neo4j — so wall-clock is roughly the suite divided by N.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Clean install dependencies
        run: pnpm install --frozen-lockfile

      # Generated type files are no longer committed; regenerate before tests.
      - name: Generate GraphQL/OGM types
        run: pnpm run codegen

      # Testcontainers manages the Neo4j container itself via the Docker daemon
      # available on GitHub-hosted Ubuntu runners. Run under c8 so the resolver
      # coverage these tests provide is reported too.
      - name: Run integration shard ${{ matrix.shard }}/4 against live Neo4j (with coverage)
        run: pnpm run test:integration:shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: 4

      # Save this shard's RAW c8 coverage; coverage-report runs one c8 report over
      # every shard's data plus the unit data (see that job).
      - name: Save integration shard ${{ matrix.shard }} coverage data
        uses: actions/upload-artifact@v4
        with:
          name: cov-v8-integration-${{ matrix.shard }}
          path: coverage/tmp
          if-no-files-found: error
          retention-days: 1

  # Combine every test job's RAW coverage into ONE report and upload it to
  # Codecov. `c8 report` over all the shards' + unit's v8 data counts each file
  # exactly once, reproducing the local `coverage:merged` number (a line covered
  # by ANY job counts as covered). Runs whenever the unit job succeeded —
  # including docs-only PRs (integration skipped → only the unit data) — so the
  # required Codecov status still posts.
  #
  # The merged report is uploaded under BOTH the `unit` and `integration` flags
  # (the same complete report each). Codecov keeps carrying a flag forward once
  # it has seen it, and the project total is built from flags — a flag-less
  # upload does NOT replace that carried-forward total. Refreshing both flags
  # with the complete merged coverage every commit makes the project total equal
  # the merged number regardless of carry-forward.
  coverage-report:
    needs: [unit-tests, integration-tests]
    if: ${{ always() && needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # c8 (and the .c8rc.json all:true source scan) needs the dependencies.
      - name: Clean install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads every cov-* artifact from this run into subfolders under
      # coverage-artifacts/ (unit v8, each integration shard's v8, and startup).
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: cov-*

      - name: Merge coverage into one report
        run: |
          set -euo pipefail
          # Gather every shard's + the unit run's raw v8 json into one temp dir.
          # Prefix by source dir so identically-named files never collide.
          mkdir -p combined-tmp merge-src
          i=0
          for d in coverage-artifacts/cov-v8-*; do
            [ -d "$d" ] || continue
            find "$d" -name '*.json' -print0 | while IFS= read -r -d '' f; do
              cp "$f" "combined-tmp/${i}-$(basename "$f")"
            done
            i=$((i + 1))
          done
          echo "Combined $(ls combined-tmp | wc -l) coverage data files."
          # One c8 report over all of it → the single-process merged lcov.
          NODE_OPTIONS=--max-old-space-size=6144 pnpm exec c8 report \
            --temp-directory=combined-tmp --reporter=lcov --reports-dir=coverage-main
          cp coverage-main/lcov.info merge-src/main.lcov
          # Union in the source-mapped startup-provisioning supplement, if present.
          if [ -f coverage-artifacts/cov-lcov-startup/lcov.info ]; then
            cp coverage-artifacts/cov-lcov-startup/lcov.info merge-src/startup.lcov
          fi
          node build_scripts/mergeLcov.js --dir merge-src --out coverage/merged.lcov

      - name: Upload merged coverage to Codecov (unit flag)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/merged.lcov
          disable_search: true
          flags: unit
          fail_ci_if_error: false
          verbose: true

      - name: Upload merged coverage to Codecov (integration flag)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/merged.lcov
          disable_search: true
          flags: integration
          fail_ci_if_error: false
          verbose: true
